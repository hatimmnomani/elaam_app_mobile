// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        androidXAnnotation = "1.7.1"
        androidXBrowser = "1.8.0"

    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgrade AGP for SDK 35 support
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.0")
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22')
    }
}
// android/build.gradle

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { subproject ->

    if (subproject.name == "react-native-exit-app") {
        subproject.afterEvaluate {
            if (subproject.name == "react-native-exit-app" && subproject.hasProperty("android")) {
            subproject.android.namespace = "com.github.wumke.RNExitApp"
            subproject.android.buildFeatures.buildConfig = true
        }
          if (subproject.name == "react-native-fs" && subproject.hasProperty("android")) {
            subproject.android.namespace = "com.rnfs"
            subproject.android.buildFeatures.buildConfig = true
        }
        }
    }
}



